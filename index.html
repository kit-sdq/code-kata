<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <title>Java Code Katas</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a
        class="header-brand"
        href="https://sdq.kastel.kit.edu/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          class="header-brand-logo"
          src="img/sdq-logo.svg"
          alt="Software Design and Quality (SDQ), KASTEL, KIT"
          width="63"
          height="32"
        />
      </a>
      <span id="site-title-slot" class="site-title-slot"></span>
      <div class="header-actions">
        <a id="lectures-link" class="icon-link" href="lectures/">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </a>
        <div class="lang-menu-wrap">
          <button
            id="lang-toggle"
            class="lang-toggle icon-link"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
          ></button>
          <ul id="lang-menu" class="lang-menu" role="menu" hidden></ul>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true"></span>
        </button>
      </div>
    </header>
    <main id="app"></main>
    <footer class="site-footer">
      <p>
        <a id="footer-source-link" href="https://gitlab.kit.edu/kit/kastel/sdq/lehre/programmieren-vorlesung/revamp2026/code-kata" target="_blank" rel="noopener noreferrer"></a>
        <span aria-hidden="true"> · </span>
        <span>GPL-3.0-or-later</span>
      </p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
